<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#1890ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- 问卷背景 -->
  <rect x="3" y="3" width="18" height="18" rx="2" ry="2" fill="#f0f8ff" stroke="#1890ff"/>
  
  <!-- 问卷标题线 -->
  <line x1="6" y1="8" x2="18" y2="8" stroke="#1890ff" stroke-width="1"/>
  
  <!-- 问题1 -->
  <line x1="6" y1="12" x2="12" y2="12" stroke="#1890ff" stroke-width="1"/>
  <circle cx="14" cy="12" r="1" fill="#1890ff"/>
  <circle cx="16" cy="12" r="1" fill="#1890ff"/>
  
  <!-- 问题2 -->
  <line x1="6" y1="15" x2="12" y2="15" stroke="#1890ff" stroke-width="1"/>
  <rect x="14" y="14" width="2" height="2" fill="#1890ff"/>
  <rect x="17" y="14" width="2" height="2" fill="#1890ff"/>
  
  <!-- 问题3 -->
  <line x1="6" y1="18" x2="12" y2="18" stroke="#1890ff" stroke-width="1"/>
  <polygon points="14,17 15,19 16,17" fill="#1890ff"/>
  <polygon points="17,17 18,19 19,17" fill="#1890ff"/>
  
  <!-- 问卷图标装饰 -->
  <circle cx="20" cy="6" r="1" fill="#ff6b6b"/>
  <circle cx="22" cy="6" r="1" fill="#4ecdc4"/>
</svg> 